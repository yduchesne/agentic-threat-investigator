[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-threat-investigator"
version = "0.1.0"
description = "An open-source threat investigation workbench."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Agentic Threat Investigator contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "argon2-cffi>=23.1,<26",
  "langgraph>=1.2.11,<2",
  # Transitive constraint: langsmith>=0.12 depends on the forked httpx2
  # package, which authlib prefers over plain httpx whenever it is
  # importable. Safety 3.8.1's platform client then passes a plain
  # httpx.Timeout into the httpx2-backed OAuth2Client and crashes with
  # "TypeError: 'httpx.Timeout' object cannot be interpreted as an integer
  # or float" on Python 3.14, breaking ./build.sh --sec. langsmith<0.12
  # keeps plain httpx and restores the working authlib code path.
  "langsmith>=0.3.45,<0.12",
  "maxminddb>=2,<4",
  # Direct LangChain dependency: the PR 20B LLM adapter imports
  # langchain_core types directly, so the dependency must not rely on
  # LangGraph's transitive dependency.
  "langchain-core>=1.6,<2",
  # First concrete v0.1 model provider. The openai SDK itself stays
  # transitive through langchain-openai and is constrained to <3 below so
  # the forked httpx2 package can never become importable (see the httpx2
  # note on langsmith).
  "langchain-openai>=1.6,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "ruff>=0.16.7,<0.17",
  "pytest>=9,<10",
  "pytest-cov>=6,<7",
  "pytest-asyncio>=1.0,<2",
  "pre-commit>=4,<5",
  "mmdb-writer>=0.2,<1",
  "bandit>=1.8,<2",
  "semgrep>=1.100,<2",
  "safety>=3,<4",
  "pip-audit>=2.7,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_threat_investigator"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Ruff is ATI's single Python formatter/linter/import sorter (see
# AGENTS.md and docs/TESTING.md). The rule set below is intentional:
#
# - E/F/W/I: pycodestyle + Pyflakes + isort baseline (E501 deliberately
#   excluded, see ignore below).
# - B/BLE: flake8-bugbear correctness plus flake8-blind-except, which is
#   the faithful non-Pylint-code equivalent of Pylint's
#   broad-exception-caught (W0718).
# - C4/SIM/RET: comprehension/simplification/return-consistency families;
#   findings are small, reviewed, and safe-autofixed only.
# - ARG: flake8-unused-arguments, the semantic equivalent of Pylint's
#   unused-argument (W0613); enforced for src (see per-file-ignores for the
#   test-tree rationale).
# - D100/D101/D103: docstring gates mirroring the Pylint defaults ATI
#   relied on (missing-module/class/function docstring). D102 (public
#   methods) and D107 (__init__) are intentionally NOT enabled: AGENTS.md
#   forbids repeating interface docstrings and Pylint exempted __init__
#   (no-docstring-rgx) under the old contract.
# - RUF100: unused-noqa detection, keeping every suppression honest.
#
# Candidate families evaluated but NOT enabled (documented in the PR
# migration map): TRY (580 tryceratops findings, mostly TRY003 message
# style; only W0707 sites existed under Pylint), UP (68 pyupgrade
# modernization findings, style-only, no old-contract equivalent), N (20
# pep8-naming findings on intentional RDAP schema-mirroring field names),
# ASYNC (3 test-only findings), E501 (formatter-incompatible, see ignore),
# RUF012/RUF001/RUF043/RUF036/RUF005 (Ruff-native style findings incl.
# intentional ambiguous test data and SQLAlchemy mapping defaults), and all
# PL* Pylint-derived codes (this PR deliberately translates to Flake8-style
# codes instead; see plan).
[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "BLE",
  "C4",
  "SIM",
  "RET",
  "ARG",
  "D100",
  "D101",
  "D103",
  "RUF100",
]
ignore = [
  # E501 is formatter-incompatible: Ruff's formatter aims at the line
  # length but does not guarantee it, and the long lines are intentional
  # (URLs, SQL fragments, error templates). Pylint's 100-column default did
  # not flag them either, so enabling E501 at 88 would strengthen the
  # contract.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# ARG (Pylint unused-argument/W0613 parity) is enforced for production code
# only. Under the old Pylint contract only seven test files suppressed
# unused-argument (via file-level pragmas); Ruff's ARG001/ARG002 fire far
# more aggressively (134 sites) on parametrized fixtures, monkeypatched
# fakes, and interface-conformance signatures that the test harness needs.
"tests/**" = ["ARG"]
# Docstring exemptions mirror the old file-level Pylint suppressions
# (missing-function-docstring/missing-class-docstring) in these two test
# files, where helpers intentionally carry no docstrings.
"tests/unit/test_audit.py" = ["D101", "D103"]
"tests/unit/test_identity_services.py" = ["D101", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_threat_investigator"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
  "unit: fast isolated tests",
  "integration: tests requiring external services",
  "provider_contract: provider contract tests",
]
addopts = "--strict-markers"
asyncio_mode = "strict"

[tool.coverage.run]
source = ["agentic_threat_investigator"]

[tool.coverage.report]
show_missing = true
fail_under = 85

# Bandit security scanning (./build.sh --sec). B101 (assert_used) is skipped
# globally with justification: asserts in src are internal invariant checks
# used for strict-Mypy control-flow narrowing, not security controls, and the
# codebase intentionally keeps them. Site-specific false positives (B105, B110,
# B311, B608) carry inline `# nosec` comments with per-site justification.
[tool.bandit]
exclude_dirs = []
skips = ["B101"]

[tool.uv]
default-groups = ["dev"]
# openai>=3 depends on the forked httpx2 package, which authlib prefers
# over plain httpx whenever it is importable; Safety 3.8.1's platform
# client then crashes with "TypeError: 'httpx.Timeout' object cannot be
# interpreted as an integer or float" on Python 3.14. langchain-openai
# accepts openai>=2.45,<4, so constrain the transitive SDK to the
# plain-httpx 2.x line.
constraint-dependencies = ["openai>=2.45,<3"]
