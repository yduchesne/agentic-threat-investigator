#
# Isolated observability-acceptance topology (PR 34). This Compose file is
# owned exclusively by ``scripts/observability-integration.sh`` and is NOT
# part of the ordinary developer compose.yaml: normal ``./build.sh --intg``
# never starts it. It reuses the exact source-controlled observability
# configs (``infra/observability/*/``) and the exact pinned images from
# ``compose.observability.yaml`` — nothing here is copied into a divergent
# tree — but runs only the five required services (Collector, Prometheus,
# Jaeger, Loki, Grafana) with harness-randomized host ports, harness-owned
# named volumes, and synthetic random Grafana credentials injected per run.
#
# No PostgreSQL, Redpanda, API, worker, frontend, or postgres-exporter is
# started: PR 34 proves telemetry *delivery*, never a datasource/LLM/Kafka/
# database workflow. Backend URLs live only here and in the verifier, never
# in the ATI generator (which knows only the Collector).

services:
  otel-collector:
    # The required vendor-neutral telemetry gateway (contrib distribution:
    # the Prometheus exporter is contrib-only). Pinned, same image as the
    # production compose.observability.yaml.
    image: docker.io/otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # OTLP/HTTP published only so the harness can prove the Collector
      # receiver is the generator's single destination; backend routing stays
      # in-network exactly as the production config declares.
      - "${ATI_OBS_COLLECTOR_OTLP_PORT}:4318"
      # health_check extension (:13131) published for bounded readiness.
      - "${ATI_OBS_COLLECTOR_HEALTH_PORT}:13131"
    depends_on:
      jaeger: { condition: service_started }
      loki: { condition: service_started }
    networks: [obsnet]

  prometheus:
    # Pinned upstream image; scrapes ATI application metrics only from
    # otel-collector:8889/metrics under job ati-otel (unchanged config).
    image: docker.io/prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - obs-prometheus-data:/prometheus
    ports:
      - "${ATI_OBS_PROMETHEUS_PORT}:9090"
    depends_on:
      otel-collector: { condition: service_started }
    networks: [obsnet]

  jaeger:
    # Jaeger 2.x all-in-one; accepts OTLP on 4317/4318 and serves the v3
    # query API/UI on 16686. In-memory storage is the pinned
    # compose.observability.yaml local-development choice.
    image: docker.io/jaegertracing/jaeger:2.21.0
    ports:
      - "${ATI_OBS_JAEGER_PORT}:16686"
    networks: [obsnet]

  loki:
    # Loki 3.x single binary with local filesystem storage and native OTLP
    # log ingestion; exact source-controlled config (14-day retention, TSDB
    # v13, structured metadata enabled, no high-cardinality indexed labels).
    image: docker.io/grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - obs-loki-data:/loki
    ports:
      - "${ATI_OBS_LOKI_PORT}:3100"
    networks: [obsnet]

  grafana:
    # Provisioning datasources/dashboards from the repository is enabled
    # explicitly; synthetic random admin credentials are injected by the
    # harness (never committed).
    image: docker.io/grafana/grafana:13.2.2
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SECURITY_ADMIN_USER: ${ATI_OBS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${ATI_OBS_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - obs-grafana-data:/var/lib/grafana
    ports:
      - "${ATI_OBS_GRAFANA_PORT}:3000"
    depends_on:
      prometheus: { condition: service_started }
      jaeger: { condition: service_started }
      loki: { condition: service_started }
    networks: [obsnet]

networks:
  obsnet:
    # Explicit harness-owned network name (per-run unique), never the
    # developer `ati` network, so the generator container attaches to exactly
    # this isolated topology.
    name: ${ATI_OBSERVABILITY_TEST_NETWORK:?Set ATI_OBSERVABILITY_TEST_NETWORK}

volumes:
  obs-prometheus-data: {}
  obs-loki-data: {}
  obs-grafana-data: {}
