# Static ATI frontend server (PR 24A).
#
# - serves dist/ with SPA history fallback (direct /investigations works);
# - proxies /api/ to the API service without weakening cookie/CSRF
#   contracts (Origin/Referer and Set-Cookie pass through unchanged);
# - never caches authenticated API responses;
# - content-hashed static assets are cacheable;
# - hides dotfiles/unknown files and sends a reviewed baseline of security
#   headers.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Small reviewed security-header baseline. Stronger CSP hardening is not
  # a 24A blocker and requires testing against Vite/MUI output.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  # The browser-facing API boundary. The backend container is only reachable
  # through this static reverse-proxy configuration; proxying preserves the
  # browser Origin/Referer + Set-Cookie headers the PR 23C CSRF and session
  # contracts rely on.
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    # Authenticated API responses must never be cached by a shared proxy.
    add_header Cache-Control "no-store" always;
  }

  # Content-hashed build assets: cache aggressively, revalidate.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # No hidden filesystem files are ever served.
  location ~ /\. {
    deny all;
  }

  # SPA history fallback: unknown paths resolve to index.html so direct
  # browser navigation to /investigations works through React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}