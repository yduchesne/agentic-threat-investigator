name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans a commit range and requires the checked-out commit's
          # parent to be available locally.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@v5
        with: { version: '0.5.30' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: ./build.sh --check
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@v5
        with: { version: '0.5.30' }
      # ubuntu-latest ships podman and a docker-compose CLI plugin. The native
      # podman-compose is installed explicitly (pinned to the validated
      # version) so the test harness does not delegate to Docker Compose,
      # which requires the Podman socket and fails under rootless Podman.
      - run: uv tool install podman-compose==1.0.6
      - run: uv sync --locked
      - run: ./integration-test.sh
