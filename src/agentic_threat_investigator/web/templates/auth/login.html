{% extends "base.html" %}
{# SPDX-License-Identifier: AGPL-3.0-only #}
{% block title %}Sign in · {{ view.title }}{% endblock %}
{% block content %}
<section class="ati-card ati-auth" aria-labelledby="ati-login-heading">
  <h1 id="ati-login-heading">Sign in</h1>
  {% if view.error %}
  <p class="ati-error" role="alert">{{ view.error }}</p>
  {% endif %}
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ view.csrf_token }}">
    <input type="hidden" name="next" value="{{ next_path }}">
    <div class="ati-field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required
             autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="ati-field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required
             autocomplete="current-password">
    </div>
    <button type="submit" class="ati-button">Sign in</button>
  </form>
</section>
{% endblock %}
