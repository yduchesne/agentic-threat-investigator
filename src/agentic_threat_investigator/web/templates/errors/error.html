{% block title %}{{ status_code }} · {{ error_title }}{% endblock %}
{% block content %}
<section class="ati-card ati-error-page" role="alert">
  <h1>{{ status_code }} {{ error_title }}</h1>
  <p>{{ error_message }}</p>

</section>
{% endblock %}
