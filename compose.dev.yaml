services:
  api:
    volumes: ["./src:/app/src:ro"]
    command: ["uvicorn", "agentic_threat_investigator.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  frontend:
    image: docker.io/library/node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    # The Vite dev server and the production Nginx frontend share the same
    # public origin (http://localhost:8080) so the local origin documented
    # for CSRF/CORS stays consistent (PR 24A).
    ports: ["8080:8080"]