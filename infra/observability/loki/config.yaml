# SPDX-License-Identifier: AGPL-3.0-only
# Loki single-binary local-development configuration (PR 29C, corrected in
# PR 29C-1).
#
# Loki runs as a single binary with local filesystem storage on the Compose
# network. It accepts ATI logs through its native OTLP ingestion endpoint
# (http://loki:3100/otlp, exported by the OpenTelemetry Collector); no
# deprecated Loki-specific Collector exporter is used. No authentication is
# required inside the local Compose network.
#
# Label/cardinality policy: the default OTLP resource-attribute index-label
# set (bounded fields such as service.name) stays in effect; high-cardinality
# identifiers (trace/span IDs, investigation/execution/request IDs, IP/domain
# content, exception messages) remain queryable structured metadata rather
# than indexed labels. Structured metadata is explicitly enabled.
#
# Retention: local-development logs are retained for 14 days
# (limits_config.retention_period: 336h). Retention is enforced by the
# Compactor (compactor.retention_enabled: true). Filesystem storage is a
# local-development choice and is not a production retention/storage
# recommendation.

target: all

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 0.0.0.0
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  # Native OTLP ingestion requires structured metadata (enabled by default in
  # Loki 3.x; kept explicit here so the contract is reviewable).
  allow_structured_metadata: true
  # Global log-retention period for this local-development stack: 14 days.
  # This is data retention, not a query-window control. Local development
  # only; not a production retention policy.
  retention_period: 336h

compactor:
  # The Compactor enforces the global retention_period for the
  # filesystem-backed TSDB/v13 stack. delete_request_store must match the
  # object store used by the schema config (filesystem here).
  retention_enabled: true
  delete_request_store: filesystem

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
