services:
  postgres:
    # Project-owned PostgreSQL 18 image: pgvector baseline + PostGIS (PR 26B).
    build: ./docker/postgres
    image: ati-postgres:0.1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ati}
      POSTGRES_USER: ${POSTGRES_USER:-ati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${ATI_POSTGRES_HOST_PORT:-54320}:5432"
    volumes:
      - "${ATI_DATA_DIR:?Set ATI_DATA_DIR in .env}/postgres/data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ati]

  # PR 28G: ATI's deterministic local/integration-test Kafka-compatible
  # broker. Redpanda is a test/development and proof-of-scope dependency only
  # (never a Python runtime dependency); the production Evidence log is the
  # broker-neutral contracts, and topic administration for real deployments
  # remains an operator concern. Single-node, single-replica by design: this
  # broker proves partition/offset/group semantics, never production HA.
  # The OUTSIDE listener advertises 127.0.0.1:<host port> so host-side
  # integration-test processes can connect through the mapped port.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://127.0.0.1:${ATI_REDPANDA_HOST_PORT:-9092}
    ports:
      - "${ATI_REDPANDA_HOST_PORT:-9092}:9092"
    networks: [ati]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ati}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ati]

  api:
    build: .
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ati}
      # API and worker must agree on the intelligence-source operating mode
      # (PR 23D). Local fake operation is the documented developer default;
      # production deployments set ATI_OPERATING_MODE=production explicitly.
      ATI_OPERATING_MODE: ${ATI_OPERATING_MODE:-fake}
      # The public browser origin (PR 24A). The static frontend container
      # and the Vite dev proxy both expose the API through the same-origin
      # /api path, so CSRF Origin validation must recognize the browser
      # origin (http://localhost:8080) served by the frontend, not the API
      # container port.
      ATI_PUBLIC_BASE_URL: ${ATI_PUBLIC_BASE_URL:-http://localhost:8080}
    command: ["uvicorn", "agentic_threat_investigator.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      fake-data-bootstrap: { condition: service_completed_successfully }
    ports: ["8000:8000"]
    networks: [ati]

  fake-data-bootstrap:
    build: .
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ati}
      ATI_DATA_DIR: /var/lib/ati
      ATI_OPERATING_MODE: ${ATI_OPERATING_MODE:-fake}
    volumes:
      - "${ATI_DATA_DIR:?Set ATI_DATA_DIR in .env}/datasets:/var/lib/ati/datasets"
    command: ["ati-fake-data-bootstrap"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [ati]

  worker:
    build: .
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ati}
      ATI_DATA_DIR: /var/lib/ati
      ATI_OPERATING_MODE: ${ATI_OPERATING_MODE:-fake}
      # The worker composes the configured real LLM at normal runtime; the
      # deterministic driver (PR 24B) selects the offline scripted boundary
      # used by offline real-stack browser tests.
      ATI_LLM_DRIVER: ${ATI_LLM_DRIVER:-openai}
      # The worker composes the configured real LLM at normal runtime.
      ATI_OPENAI_API_KEY: ${ATI_OPENAI_API_KEY:-}
    volumes:
      - "${ATI_DATA_DIR:?Set ATI_DATA_DIR in .env}/datasets:/var/lib/ati/datasets:ro"
    command: ["ati-worker", "--poll-seconds", "1.0"]
    depends_on:
      fake-data-bootstrap: { condition: service_completed_successfully }
    networks: [ati]

  geo-resolver:
    # PR 26C: the bounded asynchronous geographic-resolution worker. It is a
    # separate process from the API and the investigation worker, runs no
    # LangGraph, and uses PostgreSQL (geo_resolution + leases) as its durable
    # queue; no broker is involved. It claims bounded work in short committed
    # transactions, resolves outside any database transaction, and persists
    # outcomes through the versioned SQL API v0024.
    build: .
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ati}
      ATI_DATA_DIR: /var/lib/ati
      ATI_OPERATING_MODE: ${ATI_OPERATING_MODE:-fake}
      ATI_GEO_RESOLVER_ENABLED: ${ATI_GEO_RESOLVER_ENABLED:-true}
      ATI_GEO_RESOLVER_BATCH_SIZE: ${ATI_GEO_RESOLVER_BATCH_SIZE:-10}
      ATI_GEO_RESOLVER_LEASE_SECONDS: ${ATI_GEO_RESOLVER_LEASE_SECONDS:-300}
      ATI_GEO_RESOLVER_POLL_INTERVAL_SECONDS: ${ATI_GEO_RESOLVER_POLL_INTERVAL_SECONDS:-1.0}
      ATI_GEO_RESOLVER_MAX_ATTEMPTS: ${ATI_GEO_RESOLVER_MAX_ATTEMPTS:-3}
      ATI_GEO_RESOLVER_RETRY_BASE_SECONDS: ${ATI_GEO_RESOLVER_RETRY_BASE_SECONDS:-60.0}
      ATI_GEO_RESOLVER_RETRY_MAX_SECONDS: ${ATI_GEO_RESOLVER_RETRY_MAX_SECONDS:-3600.0}
    command: ["ati-geo-resolver"]
    depends_on:
      fake-data-bootstrap: { condition: service_completed_successfully }
    networks: [ati]

  scheduler:
    build: .
    command: ["python", "-c", "print('ATI scheduler bootstrap')"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [ati]

  frontend:
    build: ./frontend
    depends_on: [api]
    ports:
      - "${ATI_FRONTEND_HOST_PORT:-8080}:80"
    networks: [ati]

networks:
  ati:
    driver: bridge
