services:
  postgres:
    # Project-owned PostgreSQL 18 image: pgvector baseline + PostGIS (PR 26B).
    build: ./docker/postgres
    image: ati-postgres:0.1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ati}
      POSTGRES_USER: ${POSTGRES_USER:-ati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # ATI publishes the standard PostgreSQL host port by default. An optional
      # ATI_PORT_PREFIX (resolved by ./start.sh, see AGENTS.md) namespaces every
      # host-published port; container ports never change. A local collision is
      # a conflict to report, not a reason to remap the default.
      - "${ATI_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - "${ATI_DATA_DIR:?Set ATI_DATA_DIR in .env}/postgres/data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ati]

  # PR 28G: ATI's deterministic local/integration-test Kafka-compatible
  # broker. Redpanda is a test/development and proof-of-scope dependency only
  # (never a Python runtime dependency); the production Evidence log is the
  # broker-neutral contracts, and topic administration for real deployments
  # remains an operator concern. Single-node, single-replica by design: this
  # broker proves partition/offset/group semantics, never production HA.
  # The OUTSIDE listener advertises 127.0.0.1:<host port> so host-side
  # integration-test processes can connect through the mapped port.
  redpanda:
    image: docker.io/redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://127.0.0.1:${ATI_REDPANDA_HOST_PORT:-9092}
    ports:
      - "${ATI_REDPANDA_HOST_PORT:-9092}:9092"
    networks: [ati]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ati}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ati]

  api:
    build: .
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ati}
      # API and worker must agree on the intelligence-source operating mode
      # (PR 23D). Local fake operation is the documented developer default;
      # production deployments set ATI_OPERATING_MODE=production explicitly.
      ATI_OPERATING_MODE: ${ATI_OPERATING_MODE:-fake}
      # The public browser origin (PR 24A). The static frontend container
      # and the Vite dev proxy both expose the API through the same-origin
      # /api path, so CSRF Origin validation must recognize the browser
      # origin (http://localhost:8080) served by the frontend, not the API
      # container port. ``./start.sh`` derives it from the effective frontend
      # host port when unset.
      ATI_PUBLIC_BASE_URL: ${ATI_PUBLIC_BASE_URL:-http://localhost:8080}
      # V07-01: the exact browser origin of the server-rendered web adapter.
      # The web routes are served by this same FastAPI process, so the
      # browser reaches them through the API host port; both exact origins
      # share one session/CSRF authority while React and web coexist.
      #
      # The default is the standard API host origin. It is intentionally a
      # flat default: the pinned compose provider (podman-compose 1.0.6)
      # does not expand a nested ``${ATI_API_HOST_PORT:-8000}`` inside a
      # ``${ATI_WEB_BASE_URL:-...}`` default and would pass the literal
      # string through, crashing the API at startup. ``./start.sh`` derives
      # this origin from the effective API host port when it is left unset;
      # raw Compose users must set ``ATI_WEB_BASE_URL`` to the matching
      # externally visible origin (see .env.example and docs/DEPLOYMENT.md).
      ATI_WEB_BASE_URL: ${ATI_WEB_BASE_URL:-http://localhost:8000}
      # PR 29C: OTLP export. ATI processes export only when the master switch
      # is on; the endpoint (unset or blank) defaults to the in-network
      # Collector. Set ATI_OBSERVABILITY_ENABLED=false for offline/fail-open.
      ATI_OBSERVABILITY_ENABLED: ${ATI_OBSERVABILITY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # First-run bootstrap administrator (docs/CONFIGURATION.md). Seeded only
      # while the user table is empty; never resets an existing account.
      ATI_BOOTSTRAP_ADMIN_USERNAME: ${ATI_BOOTSTRAP_ADMIN_USERNAME:-}
      ATI_BOOTSTRAP_ADMIN_PASSWORD: ${ATI_BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ["uvicorn", "agentic_threat_investigator.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      fake-data-bootstrap: { condition: service_completed_successfully }
    ports: ["${ATI_API_HOST_PORT:-8000}:8000"]
    networks: [ati]

  fake-data-bootstrap:
    build: .
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ati}
      ATI_DATA_DIR: /var/lib/ati
      ATI_OPERATING_MODE: ${ATI_OPERATING_MODE:-fake}
      # PR 29C: the ingestion one-shot exports OTLP to the in-network
      # Collector so ingestion logs/metrics/traces reach the backends.
      ATI_OBSERVABILITY_ENABLED: ${ATI_OBSERVABILITY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    volumes:
      - "${ATI_DATA_DIR:?Set ATI_DATA_DIR in .env}/datasets:/var/lib/ati/datasets"
    command: ["ati-fake-data-bootstrap"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [ati]

  worker:
    build: .
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ati}
      ATI_DATA_DIR: /var/lib/ati
      ATI_OPERATING_MODE: ${ATI_OPERATING_MODE:-fake}
      # The worker composes the configured real LLM at normal runtime; the
      # deterministic driver (PR 24B) selects the offline scripted boundary
      # used by offline real-stack browser tests.
      ATI_LLM_DRIVER: ${ATI_LLM_DRIVER:-openai}
      ATI_LLM_MODEL: ${ATI_LLM_MODEL:-gpt-4o-mini}
      # PR 30A: optional non-secret OpenAI-compatible endpoint. Blank/omitted
      # keeps the OpenAI SDK default endpoint; a configured value must never
      # contain credentials.
      ATI_LLM_BASE_URL: ${ATI_LLM_BASE_URL:-}
      # Secret REFERENCE name: the variable below carrying the real key value
      # must be present in this environment for EnvVarSecretsResolver.
      ATI_LLM_API_KEY_SECRET: ${ATI_LLM_API_KEY_SECRET:-ATI_OPENAI_API_KEY}
      ATI_OPENAI_API_KEY: ${ATI_OPENAI_API_KEY:-}
      # OpenRouter example secret reference (PR 30A); see docs/DEPLOYMENT.md.
      ATI_OPENROUTER_API_KEY: ${ATI_OPENROUTER_API_KEY:-}
      # DeepSeek example secret reference. compose injects only the secret
      # value NAMES listed in this environment block, so a custom
      # ATI_LLM_API_KEY_SECRET reference (for example ATI_DEEPSEEK_API_KEY)
      # must have its value variable forwarded explicitly here.
      ATI_DEEPSEEK_API_KEY: ${ATI_DEEPSEEK_API_KEY:-}
      # PR 29A: the worker composes the selected LLM-observability backend,
      # so the typed backend selector and its LangSmith credential must reach
      # the container environment.
      ATI_LLM_OBSERVABILITY_BACKEND: ${ATI_LLM_OBSERVABILITY_BACKEND:-none}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      # PR 29C: OTLP export for the worker process (ati-worker); the standard
      # endpoint defaults to the in-network Collector.
      ATI_OBSERVABILITY_ENABLED: ${ATI_OBSERVABILITY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    volumes:
      - "${ATI_DATA_DIR:?Set ATI_DATA_DIR in .env}/datasets:/var/lib/ati/datasets:ro"
    command: ["ati-worker", "--poll-seconds", "1.0"]
    depends_on:
      fake-data-bootstrap: { condition: service_completed_successfully }
    networks: [ati]

  geo-resolver:
    # PR 26C: the bounded asynchronous geographic-resolution worker. It is a
    # separate process from the API and the investigation worker, runs no
    # LangGraph, and uses PostgreSQL (geo_resolution + leases) as its durable
    # queue; no broker is involved. It claims bounded work in short committed
    # transactions, resolves outside any database transaction, and persists
    # outcomes through the versioned SQL API v0024.
    build: .
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ati}
      ATI_DATA_DIR: /var/lib/ati
      ATI_OPERATING_MODE: ${ATI_OPERATING_MODE:-fake}
      ATI_GEO_RESOLVER_ENABLED: ${ATI_GEO_RESOLVER_ENABLED:-true}
      ATI_GEO_RESOLVER_BATCH_SIZE: ${ATI_GEO_RESOLVER_BATCH_SIZE:-10}
      ATI_GEO_RESOLVER_MAX_CONCURRENCY: ${ATI_GEO_RESOLVER_MAX_CONCURRENCY:-4}
      ATI_GEO_RESOLVER_LEASE_SECONDS: ${ATI_GEO_RESOLVER_LEASE_SECONDS:-300}
      ATI_GEO_RESOLVER_POLL_INTERVAL_SECONDS: ${ATI_GEO_RESOLVER_POLL_INTERVAL_SECONDS:-1.0}
      ATI_GEO_RESOLVER_MAX_ATTEMPTS: ${ATI_GEO_RESOLVER_MAX_ATTEMPTS:-3}
      ATI_GEO_RESOLVER_RETRY_BASE_SECONDS: ${ATI_GEO_RESOLVER_RETRY_BASE_SECONDS:-60.0}
      ATI_GEO_RESOLVER_RETRY_MAX_SECONDS: ${ATI_GEO_RESOLVER_RETRY_MAX_SECONDS:-3600.0}
      # PR 29C: OTLP export for the GEO resolver process; the standard
      # endpoint defaults to the in-network Collector.
      ATI_OBSERVABILITY_ENABLED: ${ATI_OBSERVABILITY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    command: ["ati-geo-resolver"]
    depends_on:
      fake-data-bootstrap: { condition: service_completed_successfully }
    networks: [ati]

  scheduler:
    build: .
    command: ["python", "-c", "print('ATI scheduler bootstrap')"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [ati]

  frontend:
    build: ./frontend
    depends_on: [api]
    ports:
      - "${ATI_FRONTEND_HOST_PORT:-8080}:80"
    networks: [ati]

networks:
  ati:
    driver: bridge
