repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
  # Ruff check (with safe lint fixes) and Ruff format are pinned to the same
  # version as the project dev dependency (see pyproject.toml).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      # ruff-format v0.16 also types Markdown files (formatting Python code
      # blocks inside them); ATI intentionally keeps the formatter scoped to
      # Python only, matching the pre-migration Black behavior.
      - id: ruff-format
        types: [python]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
      - id: pytest-cov
        name: pytest with coverage
        entry: uv run pytest tests/unit --cov=agentic_threat_investigator --cov-report=term-missing --cov-fail-under=85
        language: system
        pass_filenames: false
